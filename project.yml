name: ScheduleReminder

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    # 代码是 Swift 5 风格（非 Sendable 的 ObservableObject 单例等），显式用 Swift 5 语言模式，
    # 避免 Xcode 26 默认的 Swift 6 严格并发检查报错。
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  ScheduleReminder:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - ScheduleReminder/App
      - ScheduleReminder/Models
      - ScheduleReminder/Services
      - ScheduleReminder/Views
      - ScheduleReminder/Shared
    dependencies:
      - target: ScheduleReminderWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleReminder
        PRODUCT_NAME: ScheduleReminder
        CODE_SIGN_STYLE: Automatic
    info:
      path: Config/ScheduleReminder-Info.plist
      properties:
        CFBundleDisplayName: 课程迟到提醒
        CFBundleDevelopmentRegion: zh_CN
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/ScheduleReminder.entitlements
      properties:
        # AlarmKit 授权；需要 Apple 批准后才会出现在描述文件里，否则签名会失败
        com.apple.developer.alarmkit: true

  ScheduleReminderWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - ScheduleReminderWidget
      - ScheduleReminder/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ScheduleReminder.ScheduleReminderWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Config/ScheduleReminderWidget-Info.plist
      properties:
        CFBundleDisplayName: ScheduleReminderWidget
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  ScheduleReminder:
    build:
      targets:
        ScheduleReminder: all
    run:
      config: Debug
    archive:
      config: Release
